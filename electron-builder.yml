appId: com.ecommerce.image-agent
productName: ToyWhiteBG-Agent
copyright: Copyright © 2025 ecommerce-image-agent
directories:
  output: release
files:
  - out/**/*
  - "!**/*.map"
extraResources:
  # 随应用打包的字体：Arial 缺失时用度量完全一致的 Liberation Sans Bold 兜底（SIL OFL 1.1）
  - from: resources/fonts
    to: fonts
asar: true
npmRebuild: true

win:
  icon: build/icon.ico
  # 同时产出三种形态：NSIS 安装包（装完有桌面快捷方式）、便携版 .exe、免安装文件夹
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 安装后自动创建桌面与开始菜单快捷方式（用户要的「双击图标就能用」）
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 玩具白底图 Agent
  artifactName: "${productName}-${version}-Setup.${ext}"

portable:
  artifactName: "${productName}-${version}-portable.${ext}"

electronDownload:
  mirror: "https://npmmirror.com/mirrors/electron/"
